[project]
name = "dive-site-index"
version = "0.1.0"
description = "Canonical multilingual dive-site catalog and static publisher"
requires-python = ">=3.11"
dependencies = [
  "jsonschema[format]>=4.23,<5",
  "langcodes>=3.4,<4",
  "lxml>=5.3,<7",
  "PyYAML>=6.0,<7",
]

[project.scripts]
dive-site-build = "scripts.build:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["scripts"]
