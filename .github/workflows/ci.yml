name: Validate catalog

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e .
      - run: python -m unittest tests.test_build -v
      - run: dive-site-build
      - name: Verify publication boundaries
        run: |
          test -f public/index.html
          test -f public/exports/uddf/all.uddf
          test -f public/exports/uddf/countries/eg.uddf
          test -f public/exports/uddf/countries/eg/regions/south-sinai.uddf
          test ! -e public/media
          test ! -e public/sites.json
