  en:
    summary: The established diving area around Pharaoh's Island is represented as one island complex rather than as unnamed
      child sites.
    access: Reached by boat; the exact route and entry depend on the selected island sector and local briefing.
    hazards: Boat traffic, sector choice, navigation and depth changes around the island require a site-specific plan.
    marine_life: Coral pinnacles and reef fish may be encountered around the island; sightings vary.
  ru:
    summary: Подтверждённая зона дайвинга вокруг острова Фараонов представлена единым островным комплексом без неназванных
      дочерних сайтов.
    access: Доступ с лодки; конкретные маршрут и вход зависят от выбранного сектора острова и локального брифинга.
    hazards: Движение судов, выбор сектора, навигация и перепады глубины вокруг острова требуют отдельного плана.
    marine_life: У острова возможны коралловые башни и рифовые рыбы; наблюдения различаются.
