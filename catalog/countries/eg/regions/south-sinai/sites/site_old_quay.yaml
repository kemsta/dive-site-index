content:
  en:
    summary: A sheltered site on the low western side of the Ras Mohammed peninsula, aligned with the remains of
      an old jetty. Coral blocks and shallow reef structures rise from a gently deepening bottom. Water can be calmer
      here than at the exposed eastern walls, although visibility may be lower.
    access: Normally a boat dive from the sheltered western mooring, returning to the mooring or using a short live
      pickup as briefed.
    hazards: Reduced visibility, boat traffic near the mooring, entanglement or sharp material around old jetty
      remains, depth away from the shallow reef, and fragile coral structures.
    marine_life: Hard and soft corals and mixed reef fish occupy the blocks and shallow reef. Larger visitors may
      occur in the wider Ras Mohammed area but are not dependable at this sheltered site.
  ru:
    summary: Укрытый дайв-сайт на низменной западной стороне полуострова Рас-Мохаммед, расположенный вдоль остатков
      старого причала. Коралловые блоки и мелководные рифовые образования поднимаются со дна, которое плавно уходит
      на глубину. Здесь вода может быть спокойнее, чем у открытых восточных стен, хотя видимость иногда бывает хуже.
    access: Обычно погружение проводится с катера у укрытой западной швартовки с возвращением к ней либо с коротким
      подбором катером по ходу движения, в соответствии с брифингом.
    hazards: Ограниченная видимость, движение катеров возле швартовки, риск запутывания и порезов об элементы старого
      причала, увеличение глубины вдали от мелководного рифа и хрупкие коралловые образования.
    marine_life: На коралловых блоках и мелководном рифе встречаются твёрдые и мягкие кораллы, а также разнообразные
      рифовые рыбы. В более широкой акватории Рас-Мохаммеда могут появляться крупные животные, но для этого укрытого
      дайв-сайта такие встречи непредсказуемы.
