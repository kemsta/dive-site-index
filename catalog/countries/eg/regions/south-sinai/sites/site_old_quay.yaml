content:
  en:
    summary: A sheltered site on the low western side of the Ras Mohammed peninsula, aligned with the remains of
      an old jetty. Coral blocks and shallow reef structures rise from a gently deepening bottom. Water can be calmer
      here than at the exposed eastern walls, although visibility may be lower.
    access: Normally a boat dive from the sheltered western mooring, returning to the mooring or using a short live
      pickup as briefed.
    hazards: Reduced visibility, boat traffic near the mooring, entanglement or sharp material around old jetty
      remains, depth away from the shallow reef, and fragile coral structures.
    marine_life: Hard and soft corals and mixed reef fish occupy the blocks and shallow reef. Larger visitors may
      occur in the wider Ras Mohammed area but are not dependable at this sheltered site.
