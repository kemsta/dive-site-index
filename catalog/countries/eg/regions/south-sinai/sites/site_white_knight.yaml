content:
  en:
    summary: A local reef beside Sharks Bay with a shallow sandy plateau and a deeper canyon; the historical name Wichita Falls refers to sand flowing down the canyon.
    access: Mooring or boat drift toward Sharks Bay.
    hazards: Canyon depth beyond recreational limits, current, debris, overhead-like recesses and boat traffic.
    marine_life: Macro life, reef fish, morays and seasonal sightings of eagle rays or mantas.
  ru:
    summary: Местный риф рядом с Шаркс-Бей с мелким песчаным плато и более глубоким каньоном; историческое название Wichita Falls связано с потоком песка по каньону.
    access: Погружение со швартовки или дрифт с катера в сторону Шаркс-Бей.
    hazards: Глубина каньона за рекреационными пределами, течение, обломки, углубления с элементами надголовной среды и движение катеров.
    marine_life: Макрофауна, рифовые рыбы, мурены; сезонно возможны орляки и манты.
