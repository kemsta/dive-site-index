content:
  en:
    summary: A rocky Ras Mohammed headland with a coral wall, illuminated chimneys and a plateau beyond the corner.
    access: Boat-only drift; direction is selected after a current check.
    hazards: Accelerating current around the headland, wall depth, chimney recesses, separation and boat pickup.
    marine_life: Soft corals, gorgonians, lionfish, sweepers and groupers inhabit the wall and chimneys; sharks may cruise the plateau edge.
  ru:
    summary: Скалистый мыс Рас-Мохаммеда с коралловой стеной, освещёнными трубами и плато за поворотом.
    access: Только катерный дрифт; направление выбирают после проверки течения.
    hazards: Ускорение течения у мыса, глубина стены, углубления труб, разделение группы и подбор катером.
    marine_life: На стене и в трубах живут мягкие кораллы, горгонарии, крылатки, стеклянные рыбки и груперы; у края плато возможны акулы.
