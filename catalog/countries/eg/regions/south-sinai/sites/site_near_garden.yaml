content:
  en:
    summary: The Gardens site closest to Naama Bay, with an inclined plateau, pinnacles, gorgonians and a shallow coral garden.
    access: Normally a guided boat drift, though local operations may use a mooring.
    hazards: Current, depth where the plateau meets the drop-off, fragile gorgonians and boat pickup.
    marine_life: Morays, glassfish, reef fish, table corals and occasional rays or turtles.
  ru:
    summary: Ближайший к Наама-Бей сайт Gardens с наклонным плато, башнями, горгонариями и мелководным коралловым садом.
    access: Обычно дрифт с катера и гидом, хотя местные операторы могут использовать швартовку.
    hazards: Течение, глубина у перехода плато в свал, хрупкие горгонарии и подбор катером.
    marine_life: Мурены, стеклянные и другие рифовые рыбы, столовидные кораллы; возможны скаты и черепахи.
