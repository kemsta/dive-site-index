content:
  en:
    summary: A Ras Mohammed wall dive marked by a fossil coral tower and a light-filled chimney; it is distinct from the local-coast site Tower.
    access: Boat drift within the national park, following a guide and a current check.
    hazards: Current, wall depth, overhead-like chimney recesses, fragile gorgonians and boat pickup.
    marine_life: Anthias, fusiliers, butterflyfish, gorgonians, sponges and occasional turtles or pelagic fish.
  ru:
    summary: Погружение вдоль стены в Рас-Мохаммеде, отмеченное ископаемой коралловой башней и освещённой трубой; это не местный сайт Тауэр.
    access: Катерный дрифт в национальном парке после проверки течения и только с гидом.
    hazards: Течение, глубина стены, углубления трубы с элементами надголовной среды, хрупкие горгонарии и подбор катером.
    marine_life: Антиасы, фузилёры, рыбы-бабочки, горгонарии, губки; возможны черепахи и пелагические рыбы.
