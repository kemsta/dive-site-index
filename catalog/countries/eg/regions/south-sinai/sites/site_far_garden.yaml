content:
  en:
    summary: The farthest of the four named Gardens from Naama Bay, with an inclined reef, many pinnacles and the deeper Cathedral overhang.
    access: Boat mooring, semi-drift or drift depending on conditions.
    hazards: Current may strengthen beyond the pickup point; depth and overhead risk at the Cathedral require appropriate training.
    marine_life: Pinnacle reef fish, gorgonians, turtles and occasional rays or reef sharks.
  ru:
    summary: 'Самый дальний от Наама-Бей из четырёх именованных Gardens: наклонный риф, множество башен и глубокий навес Cathedral.'
    access: Погружение со швартовки, полу-дрифт или дрифт с катера по условиям.
    hazards: За точкой подбора течение может усилиться; глубина и надголовный риск в Cathedral требуют соответствующей подготовки.
    marine_life: Рифовые рыбы у башен, горгонарии, черепахи; возможны скаты и рифовые акулы.
