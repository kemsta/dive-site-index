content:
  en:
    summary: South Ras Abu Galum is the southern named dive sector near the Bedouin settlement, separate from North Ras Abu
      Galum and centred on a coral reef profile.
    access: Reached by boat or by a remote coastal approach followed by shore entry; use the locally briefed entry and exit.
    hazards: Remote logistics, shore-entry conditions, navigation and fragile coral require a conservative guided plan within
      training limits.
    marine_life: Several hard-coral forms and ordinary Red Sea reef fish are described; specific animal encounters vary.
  ru:
    summary: Южный Рас-Абу-Галум — именованный южный сектор погружений у бедуинского поселения, отдельный от Северного Рас-Абу-Галума
      и связанный с рифовым профилем.
    access: Доступ с лодки либо после удалённого перехода вдоль берега с входом с берега; используйте вход и выход из местного
      брифинга.
    hazards: Удалённая логистика, условия берегового входа, навигация и хрупкие кораллы требуют консервативного маршрута с
      гидом в пределах подготовки.
    marine_life: Описаны несколько форм твёрдых кораллов и обычные рифовые рыбы Красного моря; конкретные встречи различаются.
