content:
  en:
    summary: An offshore Lagoona reef centred on a large madrepore tower separated by a channel from the half-submerged reef.
    access: Normally reached by boat or zodiac because the reef lies several hundred metres offshore.
    hazards: Offshore access and possible current require boat support and a locally planned entry and pickup; do not confuse it with the shore-access Seven Pinnacles.
    marine_life: Napoleon wrasse gives the site its name; operators also report reef fish, stingrays, scorpionfish and varied coral growth around the tower.
  ru:
    summary: Офшорный риф Лагуны с крупной башней мадрепоровых кораллов, отделённой каналом от полузатопленного рифа.
    access: Обычно доступен с лодки или зодиака, поскольку находится в нескольких сотнях метров от берега.
    hazards: Офшорное положение и возможное течение требуют лодочной поддержки и согласованного с местным гидом входа и подбора; не путать с береговым Seven Pinnacles.
    marine_life: Название связано с рыбой-наполеоном; также описаны рифовые рыбы, хвостоколы, скорпены и разнообразные кораллы вокруг башни.
