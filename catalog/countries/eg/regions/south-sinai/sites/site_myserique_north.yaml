content:
  en:
    summary: A northern Myserique shore dive through a reef break into a coral garden and distinctive sand-and-seagrass craters
      bounded by reef walls, to 29 m.
    access: Shore entry through a break in the reef table.
    hazards: The reef-table entry requires care; current is reported as rare.
    marine_life: Blue-spotted rays and ghost pipefish are highlighted, with a large porous coral known locally as Brian's
      Brain.
  ru:
    summary: Северный береговой маршрут Myserique через проход в рифе к коралловому саду и характерным кратерам с песком и
      морской травой между рифовыми стенками; глубина до 29 м.
    access: Вход с берега через разрыв в рифовой платформе.
    hazards: При проходе через рифовую платформу нужна осторожность; течение отмечается редко.
    marine_life: Выделяются синепятнистые хвостоколы и рыбы-призраки, а также крупный пористый коралл с местным названием
      Brian's Brain.
