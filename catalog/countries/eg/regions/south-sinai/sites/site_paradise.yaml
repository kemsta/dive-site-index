content:
  en:
    summary: A local reef between Ras Umm Sid and Amphoras, with a sandy plateau and tall soft-coral-covered pinnacles.
    access: Usually a gentle day-boat drift.
    hazards: Depth near the drop-off, occasional current, fragile pinnacles and boat traffic.
    marine_life: Soft corals, table corals, sea fans and common reef fish; pelagic visitors are possible.
  ru:
    summary: Местный риф между Рас-Умм-Сидом и Амфорами с песчаным плато и высокими башнями, покрытыми мягкими кораллами.
    access: Обычно спокойный дрифт с дневного катера.
    hazards: Глубина у свала, периодическое течение, хрупкие башни и движение катеров.
    marine_life: Мягкие и столовидные кораллы, горгонарии и обычные рифовые рыбы; возможны пелагические гости.
