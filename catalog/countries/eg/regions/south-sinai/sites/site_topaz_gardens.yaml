  en:
    summary: A named Taba boat dive over coral gardens on a sloping reef, also shortened to Topaz.
    access: Boat access; follow the operator-selected mooring, entry and pickup procedure.
    hazards: Boat traffic, depth changes and contact with fragile coral require controlled buoyancy and a local briefing.
    marine_life: Reef fish and coral-associated animals may be seen among the coral heads.
  ru:
    summary: Именованный лодочный дайв-сайт Табы с коралловыми садами на покатом рифе; также используется краткое имя Topaz.
    access: Доступ с лодки; следуйте выбранным оператором правилам швартовки, входа и подбора.
    hazards: Движение судов, перепады глубины и риск контакта с хрупкими кораллами требуют контроля плавучести и локального
      брифинга.
    marine_life: Среди коралловых голов возможны рифовые рыбы и связанная с кораллами фауна.
