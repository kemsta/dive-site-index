content:
  en:
    summary: A Taba Heights site with coral pinnacles over sand, represented separately from neighbouring Angel's Net.
    access: Boat access; follow the local mooring, entry and pickup procedure.
    hazards: Boat traffic, shallow overhead activity, navigation among pinnacles and fragile coral require care.
    marine_life: Reef fish may gather around the pinnacles; particular encounters are variable.
  ru:
    summary: Сайт Taba Heights с коралловыми башнями над песчаным дном, представленный отдельно от соседнего Angel’s Net.
    access: Доступ с лодки; следуйте местным правилам швартовки, входа и подбора.
    hazards: Движение судов, активность у поверхности, навигация между башнями и хрупкие кораллы требуют осторожности.
    marine_life: У коралловых башен возможны скопления рифовых рыб; конкретные встречи непредсказуемы.
