content:
  en:
    summary: A long sandy underwater valley between two tall reef walls, reached across a sloping coral garden; the valley
      floor drops below 50 m.
    access: Shore access beside a small camp, followed by a swim over the sloping coral garden.
    hazards: The valley floor exceeds 50 m and the site supports technical profiles; recreational divers should remain on
      the reef walls within their limits.
    marine_life: Moray eels, nudibranchs, reef fish, octopus and shrimp are reported among the walls and coral garden.
  ru:
    summary: Длинная песчаная подводная долина между двумя высокими рифовыми стенками, к которой проходят через пологий коралловый
      сад; дно уходит глубже 50 м.
    access: Береговой вход рядом с небольшим лагерем, затем проход над пологим коралловым садом.
    hazards: Дно долины глубже 50 м, возможны технические профили; рекреационным дайверам следует держаться рифовых стенок
      в пределах своей подготовки.
    marine_life: Среди стенок и кораллового сада упоминаются мурены, голожаберные моллюски, рифовые рыбы, осьминоги и креветки.
