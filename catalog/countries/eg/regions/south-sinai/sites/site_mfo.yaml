content:
  en:
    summary: A shallow reef-wall dive beside the Multinational Force and Observers camp, with pinnacles between the reef and
      seagrass and a maximum reported depth of 8 m.
    access: Shore entry by the MFO camp; the return can become a short drift exit over the reef table at high tide.
    hazards: The reef-table exit depends on sufficient tide; otherwise return to the entry point.
    marine_life: Moray eels, nudibranchs, blue-spotted rays, crocodilefish and small reef life are reported.
  ru:
    summary: Мелководный маршрут вдоль рифовой стенки у лагеря Многонациональных сил и наблюдателей; между рифом и морской
      травой лежат пинакли, заявленная максимальная глубина — 8 м.
    access: Вход с берега у лагеря MFO; при высокой воде возможен короткий дрейфовый выход через рифовую платформу.
    hazards: Выход через рифовую платформу зависит от уровня воды; иначе следует вернуться к точке входа.
    marine_life: Упоминаются мурены, голожаберные моллюски, синепятнистые хвостоколы, рыбы-крокодилы и мелкая рифовая фауна.
