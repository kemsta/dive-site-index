content:
  en:
    summary: A distinct reef at the south end of Dahab Bay, with a sandy slope, Roman's Rock pinnacle, reef wall, table corals and a deeper swim-through feature.
    access: Local walk-in shore dive near the Mashraba bridge; routes may return through the shallows or continue from Bannerfish Bay when planned as a drift.
    hazards: The deep swim-through is not part of a routine recreational profile and requires appropriate qualification and planning; sediment can enter the bay after flash floods.
    marine_life: Glassfish and anthias gather around pinnacles; Napoleon wrasse, groupers, rays, turtles, seahorses and gorgonians are also reported.
  ru:
    summary: 'Отдельный риф на юге бухты Дахаб: песчаный склон, пиннакл Roman''s Rock, рифовая стенка, столовые кораллы и глубокий сквозной проход.'
    access: Местное береговое погружение у моста Машраба; маршрут возвращается по мелководью либо идёт сюда дрейфом от Bannerfish Bay.
    hazards: Глубокий сквозной проход не относится к обычному рекреационному профилю и требует соответствующей квалификации; после ливневых паводков в бухту попадает осадок.
    marine_life: У пиннаклов собираются стеклянные рыбки и антиасы; также отмечают наполеонов, груперов, скатов, черепах, морских коньков и горгонарий.
