content:
  en:
    summary: A northern El Hibeq shore dive over coral outcrops, sand and seagrass, with an eel garden and a maximum reported
      depth of 30 m.
    access: Careful shore entry over a rocky area.
    hazards: Rocky entry; keep within certification limits on the deeper part of the site.
    marine_life: Blue-spotted rays, crocodilefish, moray eels, longnose hawkfish and schools of reef fish are reported.
  ru:
    summary: Северный береговой маршрут Эль-Хибека среди коралловых выходов, песка и морской травы; отмечен сад угрей, заявленная
      максимальная глубина — 30 м.
    access: Осторожный вход с берега по каменистому участку.
    hazards: Каменистый вход; на глубокой части следует соблюдать пределы сертификации.
    marine_life: Упоминаются синепятнистые хвостоколы, рыбы-крокодилы, мурены, длиннорылые рыбы-ястребы и стаи рифовых рыб.
