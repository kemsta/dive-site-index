content:
  en:
    summary: A local coastal drift between Amphoras and Paradise, sharing their fringing wall, sandy slope and scattered coral pinnacles.
    access: Normally dived from a day boat as a gentle drift.
    hazards: Depth near the outer drop-off, current, fragile coral and boat pickup.
    marine_life: Typical coral-garden and reef fish; turtles and larger visitors are possible but not guaranteed.
  ru:
    summary: Местный прибрежный дрифт между Амфорами и Парадайзом с окаймляющей стенкой, песчаным склоном и отдельными коралловыми башнями.
    access: Обычно спокойный дрифт с дневного катера.
    hazards: Глубина у внешнего свала, течение, хрупкие кораллы и подбор катером.
    marine_life: Типичная фауна кораллового сада и рифовые рыбы; черепахи и крупные гости возможны, но не гарантированы.
