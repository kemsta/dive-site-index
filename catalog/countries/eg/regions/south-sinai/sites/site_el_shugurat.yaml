content:
  en:
    summary: El Shugurat is a separate boat dive in the Gabr el Bint corridor, with an open canyon leading to a reef wall
      and a field of gorgonian fans.
    access: Boat access; the drop point, direction and pickup are set by the operator briefing.
    hazards: Canyon walls, wall depth, open-water exit and drift navigation require an appropriate plan and controlled buoyancy.
    marine_life: Gorgonian fans, black coral, glassfish, longnose hawkfish and reef-associated animals are described; sightings
      vary.
  ru:
    summary: Эль-Шугурат — отдельный лодочный сайт в коридоре Габр-эль-Бинт с открытым каньоном, ведущим к рифовой стенке
      и полю горгоний.
    access: Доступ с лодки; точку сброса, направление и подбор определяют на брифинге оператора.
    hazards: Стенки каньона, глубина у рифовой стенки, выход в открытую воду и навигация на дрейфе требуют подходящего плана
      и контроля плавучести.
    marine_life: Описаны горгонии, чёрные кораллы, стеклянные рыбки, длиннорылые кудрепёры и рифовая фауна; наблюдения различаются.
