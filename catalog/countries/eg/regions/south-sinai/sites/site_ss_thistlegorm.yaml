content:
  en:
    summary: A British wartime freighter wreck in the Strait of Gubal, widely dived for its surviving structure and military cargo. This record represents the wreck as a site and does not imply that penetration is part of a standard dive.
    access: Reached by dive boat or liveaboard; trip format and mooring arrangements vary by operator and conditions.
    hazards: Wreck structure, cargo, depth, current, boat traffic, and any overhead route require an appropriate plan. Penetration requires suitable wreck training and equipment.
    marine_life: The wreck supports established marine growth and reef life, while open-water encounters remain variable.
  ru:
    summary: Затонувший британский транспорт военного времени в проливе Губаль, известный сохранившимися конструкциями и военным грузом. Запись описывает судно как дайв-сайт и не подразумевает, что проникновение входит в стандартное погружение.
    access: Доступ с дайв-бота или сафари-бота; формат поездки и организация швартовки зависят от оператора и условий.
    hazards: Конструкции судна, груз, глубина, течение, движение лодок и любой маршрут под перекрытием требуют отдельного плана. Для проникновения необходимы соответствующая рэк-подготовка и снаряжение.
    marine_life: На судне сформировались обрастания и сообщества рифовых организмов; встречи в открытой воде остаются переменными.
