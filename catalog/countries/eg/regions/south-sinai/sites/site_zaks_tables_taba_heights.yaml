content:
  en:
    summary: A Taba Heights reef of table corals and coral heads over sand, also recorded in singular and Zack spellings.
    access: Boat access; follow the operator-selected mooring, route and pickup procedure.
    hazards: Boat traffic, navigation over sand and fragile table corals require careful buoyancy and route control.
    marine_life: Reef fish and small animals may shelter around the coral heads; sightings vary.
  ru:
    summary: Риф Taba Heights со столовыми кораллами и коралловыми головами над песком; встречаются также формы единственного
      числа и написание Zack.
    access: Доступ с лодки; следуйте выбранным оператором правилам швартовки, маршрута и подбора.
    hazards: Движение судов, навигация над песком и хрупкие столовые кораллы требуют точного контроля плавучести и маршрута.
    marine_life: У коралловых голов возможны рифовые рыбы и мелкая фауна; наблюдения различаются.
