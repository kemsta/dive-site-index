content:
  en:
    summary: A nineteenth-century steamship wreck on the northern face of Sha'ab Abu Nuhas, lying between Giannis D and the tile wreck. Its older iron framework and extensive marine
      growth distinguish it from the neighboring modern freighters.
    access: Reached by boat or liveaboard; access is subject to sea state on the exposed reef face.
    hazards: Current, surge, fragile historic structure, sharp metal, entanglement, boat traffic, and overhead spaces require a conservative plan. Penetration requires appropriate training
      and equipment.
    marine_life: Dense encrusting growth and reef fish use the open framework; larger encounters are variable.
  ru:
    summary: Рэк парохода XIX века на северной стороне Шааб-Абу-Нухаса между «Яннис D» и рэком с плиткой. Старый железный каркас и обильные обрастания отличают его от соседних современных
      грузовых судов.
    access: Доступ с лодки или сафари-бота; возможность погружения зависит от состояния моря на открытой стороне рифа.
    hazards: Течение, раскачка, хрупкие исторические конструкции, острый металл, риск запутывания, движение судов и надголовная среда требуют консервативного плана. Для проникновения
      нужны соответствующая подготовка и снаряжение.
    marine_life: Открытый каркас густо покрыт обрастаниями и населён рифовыми рыбами; встречи с крупными животными непредсказуемы.
