content:
  en:
    summary: A sheltered local bay reef with a shallow coral plateau, deeper pinnacles and long-established use for training, relaxed and night dives.
    access: Shore or boat access within Sharks Bay, subject to resort and jetty rules.
    hazards: Boat and jetty traffic, localized drop-offs, fragile coral and night-navigation hazards.
    marine_life: Macro life, crustaceans, cephalopods, scorpionfish, stonefish and reef fish; occasional rays occur.
  ru:
    summary: Защищённый местный риф бухты с мелким коралловым плато и более глубокими башнями, давно используемый для учебных, спокойных и ночных погружений.
    access: Доступ с берега или катера в Шаркс-Бей с учётом правил курортов и причалов.
    hazards: Движение катеров и у причалов, локальные свалы, хрупкие кораллы и риски ночной навигации.
    marine_life: Макрофауна, ракообразные, головоногие, скорпены, бородавчатки и рифовые рыбы; иногда встречаются скаты.
