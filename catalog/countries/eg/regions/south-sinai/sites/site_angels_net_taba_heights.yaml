  en:
    summary: A Taba Heights reef of coral heads and sandy sections, named for remains of a fishing net and distinct from Aquarium.
    access: Boat access; use the operator-designated entry, route and pickup procedure.
    hazards: Boat traffic, fishing-line or net remnants, depth and fragile coral require careful route control.
    marine_life: Reef fish and small animals may shelter around coral heads; sightings vary.
  ru:
    summary: Риф Taba Heights с коралловыми головами и песчаными участками, названный по остаткам рыболовной сети и отличающийся
      от Aquarium.
    access: Доступ с лодки; используйте назначенные оператором вход, маршрут и порядок подбора.
    hazards: Движение судов, остатки лески или сети, глубина и хрупкие кораллы требуют внимательного контроля маршрута.
    marine_life: У коралловых голов возможны рифовые рыбы и мелкая фауна; наблюдения различаются.
