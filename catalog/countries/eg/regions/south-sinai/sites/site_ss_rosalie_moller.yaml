content:
  en:
    summary: A large Second World War cargo-ship wreck lying west of Gubal Seghir. It is a distinct, deep wreck site and should not be grouped with Bluff Point or the island's shallower
      wrecks.
    access: Reached by boat, most commonly on a northern-wreck liveaboard itinerary or a specially arranged trip; access is weather- and operator-dependent.
    hazards: Depth, limited no-decompression time, current, boat traffic, entanglement, unstable wreck structure, and overhead spaces require an appropriate plan. Penetration requires
      wreck training and suitable equipment.
    marine_life: Established marine growth and reef fish occur around the hull; open-water encounters vary.
  ru:
    summary: Крупный рэк грузового судна времён Второй мировой войны к западу от Губаль-Сегир. Это самостоятельный глубокий сайт, который не следует объединять с Блафф-Пойнтом или более
      мелководными рэками острова.
    access: Доступ с лодки, чаще в рамках северного рэк-маршрута сафари или специально организованной поездки; возможность погружения зависит от погоды и оператора.
    hazards: Глубина, короткое бездекомпрессионное время, течение, движение судов, риск запутывания, неустойчивые конструкции и надголовная среда требуют соответствующего плана. Для
      проникновения нужны рэк-подготовка и подходящее снаряжение.
    marine_life: На корпусе есть устойчивые обрастания и рифовая фауна; встречи в открытой воде непредсказуемы.
