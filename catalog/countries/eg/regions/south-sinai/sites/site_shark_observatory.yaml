content:
  en:
    summary: A sheer wall beneath the Shark Observatory headland in Ras Mohammed National Park. Inlets, overhangs,
      and small open recesses break up the wall, while sunlight enters through the shallow fringing reef above.
      It is generally planned as a drift with close depth control rather than as a search specifically for sharks.
    access: Boat drift with live pickup; descend with the group and maintain a clear wall reference while following
      the guide's current plan.
    hazards: Current, rapid depth gain beside the near-vertical wall, blue-water separation, overhangs, and boat
      traffic. An SMB and reliable buoyancy control are important.
    marine_life: Large schools of reef fish, turtles, and occasional larger visitors may be seen. The site's name
      should not be treated as a guarantee of shark sightings.
