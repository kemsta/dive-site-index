content:
  en:
    summary: A distinct anemone-covered plateau immediately north of Shark Reef, often used as the start of a longer drift toward Shark Reef.
    access: Normally reached by day boat and conducted as a guided drift.
    hazards: Potentially strong or changing current, blue-water crossing toward Shark Reef, depth at the wall and boat traffic.
    marine_life: Dense anemone and clownfish colonies, table and soft corals, turtles and passing pelagic fish may be seen.
  ru:
    summary: Отдельное плато с многочисленными анемонами к северу от Шарк-Рифа; его часто используют как начало более длинного дрейфа к Шарк-Рифу.
    access: Обычно сюда приходят на дневном катере и погружаются в сопровождении гида в режиме дрейфа.
    hazards: Возможны сильное или меняющееся течение, переход в синей воде к Шарк-Рифу, большая глубина у стены и движение катеров.
    marine_life: Характерны плотные колонии анемон и рыб-клоунов, столовидные и мягкие кораллы; возможны черепахи и пелагические рыбы.
