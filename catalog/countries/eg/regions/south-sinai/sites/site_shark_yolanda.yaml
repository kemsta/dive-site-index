content:
  en:
    summary: A classic Ras Mohammed drift linking the current-swept wall of Shark Reef with Yolanda Reef and the
      shallow saddle between them. The reachable remains of the Jolanda's cargo, including bathroom fittings, lie
      on the reef plateau; the main hull slipped far beyond recreational depth. The route can deliver dense schooling
      fish, but its exposed position demands disciplined depth and group control.
    access: Usually a negative-entry or controlled boat drift with live pickup. Route and direction must be selected
      after checking current and surface traffic.
    hazards: Strong current, rapid depth change beside the wall, blue-water separation, busy boat traffic, and sharp
      or unstable wreck debris. Removing protected cargo or natural material is prohibited.
    marine_life: Large schools of snapper and other reef fish are a seasonal highlight; barracuda, jacks, Napoleon
      wrasse, turtles, and occasional pelagic visitors may also appear.
  ru:
    summary: Классический дрейфовый маршрут в Рас-Мохаммеде, соединяющий омываемую течением стенку рифа Шарк с
      рифом Йоланда и мелководной седловиной между ними. Доступные для осмотра остатки груза судна «Йоланда», включая
      сантехнику, лежат на рифовом плато; основной корпус соскользнул далеко за пределы рекреационных глубин. На
      маршруте можно увидеть плотные косяки рыб, однако открытое расположение места требует строгого контроля глубины
      и сохранения группы.
    access: Обычно применяют вход с отрицательной плавучестью либо выполняют контролируемый дрейф с катера с подбором в
      открытой воде. Маршрут и направление необходимо выбирать после проверки течения и движения судов на поверхности.
    hazards: Сильное течение, резкое увеличение глубины у стенки, отрыв от группы в открытой воде, интенсивное движение
      катеров, а также острые или неустойчивые обломки судна. Изъятие охраняемых частей груза или природных объектов
      запрещено.
    marine_life: Крупные косяки луцианов и других рифовых рыб — сезонная достопримечательность; также могут встречаться
      барракуды, каранксы, губаны-наполеоны, черепахи и отдельные пелагические виды.
