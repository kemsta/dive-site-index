  en:
    summary: Named sector in the CDWS compound Bawaki Dolphin Bay area; African Divers describes a shore dive to about 40
      m with an old fishing-boat engine.
    access: Shore access; use the locally briefed entry and route.
    hazards: Entry conditions, depth, navigation and fragile coral require a conservative plan within training limits.
    marine_life: Corals, reef fish, nudibranchs and cleaning stations are reported.
  ru:
    summary: Именованный сектор составной зоны CDWS Bawaki Dolphin Bay; African Divers описывает береговой маршрут до примерно
      40 м с двигателем старой рыбацкой лодки.
    access: Доступ с берега; используйте вход и маршрут по местному брифингу.
    hazards: Условия входа, глубина, навигация и хрупкие кораллы требуют консервативного плана в пределах подготовки.
    marine_life: Упоминаются кораллы, рифовые рыбы, голожаберные моллюски и станции очистки.
