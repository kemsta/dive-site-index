content:
  en:
    summary: A shore reef with large table corals, craters and valleys beyond 40 m, continuing as a steep coral slope into
      technical depths beyond 80 m.
    access: Snorkel over rocks before descending onto the shallow coral garden.
    hazards: Rocky approach and rapid depth increase; the deeper slope is beyond recreational limits.
    marine_life: Blue-spotted rays, stingrays, feathertail rays, surgeonfish and glassfish are reported.
  ru:
    summary: Береговой риф с крупными столовыми кораллами, кратерами и долинами глубже 40 м; далее крутой коралловый склон
      уходит на технические глубины свыше 80 м.
    access: К каменистому входу проходят по поверхности, затем погружаются на мелководный коралловый сад.
    hazards: Каменистый подход и быстрое увеличение глубины; глубокий склон выходит за рекреационные пределы.
    marine_life: Упоминаются синепятнистые хвостоколы, другие хвостоколы, перьехвостые скаты, рыбы-хирурги и стеклянные рыбки.
