content:
  en:
    summary: A compact reef immediately west of Yolanda Reef in the Ras Mohammed complex. Its north and west sides
      border a broad shallow plateau, while the south and east edges fall into deep water. It can be visited as
      part of a wider Shark–Yolanda itinerary or treated as a separate current-dependent reef dive.
    access: Boat drift or live pickup coordinated with the nearby Yolanda and Shark Reef traffic pattern. Route
      selection must account for the current around the exposed reef complex.
    hazards: Strong current, steep drop-off, depth, blue-water separation, and concentrated boat traffic near the
      neighbouring major sites.
    marine_life: Hard and soft coral communities and mixed reef fish occupy the plateau; larger schooling fish and
      pelagic visitors may move through the wider Ras Mohammed reef system.
  ru:
    summary: Компактный риф непосредственно к западу от рифа Йоланда в комплексе Рас-Мохаммед. С северной и западной
      сторон к нему примыкает широкое мелководное плато, а южный и восточный края обрываются в глубокую воду. Его можно
      посетить в рамках более протяжённого маршрута Шарк–Йоланда либо провести отдельное погружение, план которого
      зависит от течения.
    access: Дрифтовое погружение с катера или подбор на ходу, согласованный с движением катеров у соседних рифов
      Йоланда и Шарк. При выборе маршрута необходимо учитывать течение вокруг открытого рифового комплекса.
    hazards: Сильное течение, крутой свал, глубина, риск разделения группы в открытой воде и интенсивное движение
      катеров возле соседних крупных дайв-сайтов.
    marine_life: На плато обитают сообщества твёрдых и мягких кораллов и разнообразные рифовые рыбы; через более
      широкую рифовую систему Рас-Мохаммеда могут проходить косяки крупных рыб и пелагические животные.
