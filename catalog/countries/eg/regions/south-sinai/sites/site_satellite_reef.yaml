content:
  en:
    summary: A compact reef immediately west of Yolanda Reef in the Ras Mohammed complex. Its north and west sides
      border a broad shallow plateau, while the south and east edges fall into deep water. It can be visited as
      part of a wider Shark–Yolanda itinerary or treated as a separate current-dependent reef dive.
    access: Boat drift or live pickup coordinated with the nearby Yolanda and Shark Reef traffic pattern. Route
      selection must account for the current around the exposed reef complex.
    hazards: Strong current, steep drop-off, depth, blue-water separation, and concentrated boat traffic near the
      neighbouring major sites.
    marine_life: Hard and soft coral communities and mixed reef fish occupy the plateau; larger schooling fish and
      pelagic visitors may move through the wider Ras Mohammed reef system.
