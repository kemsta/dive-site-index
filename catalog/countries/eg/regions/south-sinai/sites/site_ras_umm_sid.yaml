content:
  en:
    summary: A prominent Sharm headland dive combining a wall, a current-swept corner, a gorgonian-rich section,
      and a shallower coral plateau. It can be entered from shore under local access arrangements or dived from
      a boat, preferably as a semi-drift or drift when current is running. Recreational routes usually focus on
      the upper 30 m even though the wall continues much deeper.
    access: Possible from shore where access is permitted, or by boat. Current at the cape can make returning to
      the original exit difficult, so agree on mooring return versus drift pickup before descent.
    hazards: Strong current at the corner, rapid depth gain beside the wall, boat traffic, shore-entry conditions,
      and separation. Carry an SMB for boat or semi-drift plans.
    marine_life: Gorgonian fans, hard and soft corals, goatfish, jackfish, barracuda, tuna, Napoleon wrasse, and
      eagle rays may be seen; rare larger visitors are possible but unpredictable.
  ru:
    summary: Знаковый дайв-сайт у мыса в Шарм-эш-Шейхе, объединяющий стену, омываемый течением угол, участок с
      многочисленными горгонариями и более мелководное коралловое плато. Вход возможен с берега при наличии местного
      разрешения либо с катера; при течении предпочтителен полудрифтовый или дрифтовый профиль. Рекреационные маршруты
      обычно проходят в верхних 30 м, хотя стена уходит значительно глубже.
    access: Возможен вход с берега там, где он разрешён, либо погружение с катера. Из-за течения у мыса возвращение
      к исходной точке выхода может быть затруднено, поэтому до спуска согласуйте возвращение к швартовке или подбор
      после дрейфа.
    hazards: Сильное течение у угла, быстрое увеличение глубины рядом со стеной, движение катеров, условия входа
      с берега и риск разделения группы. Для погружений с катера или в полудрифте имейте при себе сигнальный буй SMB.
    marine_life: Здесь можно увидеть веерные горгонарии, твёрдые и мягкие кораллы, барабулек, каранксов, барракуд,
      тунцов, губанов-наполеонов и орляков; редкие встречи с более крупными животными возможны, но непредсказуемы.
