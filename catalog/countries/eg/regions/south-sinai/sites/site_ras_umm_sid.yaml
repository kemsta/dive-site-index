content:
  en:
    summary: A prominent Sharm headland dive combining a wall, a current-swept corner, a gorgonian-rich section,
      and a shallower coral plateau. It can be entered from shore under local access arrangements or dived from
      a boat, preferably as a semi-drift or drift when current is running. Recreational routes usually focus on
      the upper 30 m even though the wall continues much deeper.
    access: Possible from shore where access is permitted, or by boat. Current at the cape can make returning to
      the original exit difficult, so agree on mooring return versus drift pickup before descent.
    hazards: Strong current at the corner, rapid depth gain beside the wall, boat traffic, shore-entry conditions,
      and separation. Carry an SMB for boat or semi-drift plans.
    marine_life: Gorgonian fans, hard and soft corals, goatfish, jackfish, barracuda, tuna, Napoleon wrasse, and
      eagle rays may be seen; rare larger visitors are possible but unpredictable.
