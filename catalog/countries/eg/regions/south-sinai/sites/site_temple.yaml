content:
  en:
    summary: A sheltered local reef site named for large coral pinnacles that resemble columns. The main route crosses
      a sandy bay at about 10–18 m and circles several pinnacles, including shallow, light-filled openings. Coral
      cover, glassfish, lionfish, morays, and blue-spotted stingrays make it useful for an easy scenic or night
      dive.
    access: Normally a mooring dive from a day boat, returning to the same area unless the guide plans a drift toward
      a neighbouring site.
    hazards: Local current around the exposed side of the pinnacles, disorientation between similar coral heads,
      fragile coral, and overhead risk if entering any opening. Use only openings approved in the site briefing.
    marine_life: Giant morays, blue-spotted stingrays, lionfish, scorpionfish, glassfish, pipefish, gorgonians,
      and mixed hard and soft corals are reported.
  ru:
    summary: Защищенный местный рифовый дайв-сайт, названный в честь крупных коралловых останцев, напоминающих колонны.
      Основной маршрут пересекает песчаную бухту на глубине около 10–18 м и огибает несколько останцев, включая
      мелководные проемы, наполненные светом. Коралловый покров, стеклянные рыбки, крылатки, мурены и синепятнистые
      хвостоколы делают это место подходящим для несложного живописного или ночного погружения.
    access: Обычно это погружение со швартовки дневного катера с возвращением в тот же район, если только гид не
      планирует дрейф к соседнему дайв-сайту.
    hazards: Локальное течение с открытой стороны останцев, риск потерять ориентацию среди похожих коралловых голов,
      хрупкие кораллы и риск надголовной среды при входе в любой проем. Используйте только проемы, разрешенные на
      брифинге по дайв-сайту.
    marine_life: Отмечаются гигантские мурены, синепятнистые хвостоколы, крылатки, скорпены, стеклянные рыбки,
      рыбы-иглы, горгонарии, а также разнообразные твердые и мягкие кораллы.
