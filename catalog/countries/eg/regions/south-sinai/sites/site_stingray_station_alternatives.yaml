content:
  en:
    summary: A named reef sector at the western extremity of The Alternatives, associated with an irregular pinnacle and sandy habitat. It is modeled as a subsite of the wider Alternatives
      chain, not as an alias for the entire chain.
    access: Boat or liveaboard access; the site is usually approached as part of an Alternatives dive according to mooring, current, and visibility.
    hazards: Variable current, reduced visibility over sand, separation among coral heads, boat traffic, and navigation away from the main pinnacle group require a guided route and surface
      signaling.
    marine_life: Blue-spotted stingrays may gather seasonally or use the sandy cleaning area, but sightings are not guaranteed; reef fish and small coral-associated life are more consistent.
  ru:
    summary: Именованный сектор рифа на западной оконечности «Альтернатив», связанный с неровной коралловой башней и песчаным участком. Он представлен как подсайт более широкой цепочки,
      а не как алиас всей группы.
    access: Доступ с лодки или сафари-бота; обычно сюда заходят в рамках погружения на «Альтернативах» с учётом швартовки, течения и видимости.
    hazards: Переменное течение, ухудшение видимости над песком, риск разделения среди коралловых голов, движение судов и удаление от основной группы башен требуют контролируемого маршрута
      и сигнализации на поверхности.
    marine_life: Голубопятнистые хвостоколы могут сезонно собираться или использовать песчаную станцию очистки, но встреча не гарантирована; рифовые рыбы и мелкие коралловые организмы
      более постоянны.
