  en:
    summary: Shore-diving area with north and south routes over seagrass and sloping coral gardens; the routes remain parts
      of one site.
    access: Shore access; use the locally briefed entry and route.
    hazards: Entry conditions, depth, navigation and fragile coral require a conservative plan within training limits.
    marine_life: Reef fish and small coral-associated animals occur across the reef and seagrass habitats.
  ru:
    summary: Район береговых погружений с северным и южным маршрутами над морской травой и покатыми коралловыми садами; маршруты
      остаются частями одного сайта.
    access: Доступ с берега; используйте вход и маршрут по местному брифингу.
    hazards: Условия входа, глубина, навигация и хрупкие кораллы требуют консервативного плана в пределах подготовки.
    marine_life: На рифе и участках морской травы встречаются рифовые рыбы и мелкая коралловая фауна.
