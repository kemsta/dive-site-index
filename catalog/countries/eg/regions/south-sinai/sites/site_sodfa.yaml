content:
  en:
    summary: A quieter local drift site with a sandy plateau, coral pinnacles and sea fans near the drop-off.
    access: Boat drift; no shore-access claim is assumed.
    hazards: Current, drop-off depth, separation, fragile sea fans and pickup traffic.
    marine_life: Reef fish, anthias and life associated with pinnacles and gorgonians.
  ru:
    summary: Более тихий местный дрифт-сайт с песчаным плато, коралловыми башнями и горгонариями у свала.
    access: Дрифт с катера; береговой доступ не предполагается.
    hazards: Течение, глубина свала, разделение группы, хрупкие горгонарии и движение катеров при подборе.
    marine_life: Рифовые рыбы, антиасы и обитатели коралловых башен и горгонарий.
