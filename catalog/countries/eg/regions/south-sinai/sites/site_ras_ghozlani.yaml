content:
  en:
    summary: A drift dive on the northern outer side of Marsa Bareika, where a fringing reef and sandy plateau lead
      to a drop-off at roughly 25–30 m. Coral pinnacles, large table corals, sea fans, and small recreational swim-throughs
      create a varied route. Diving is restricted to the permitted outer reef so that protected nesting areas inside
      the bay remain undisturbed.
    access: No fixed mooring is assumed; normally conducted as a boat drift after a current check, with pickup outside
      the restricted zone.
    hazards: Current, depth at the drop-off, separation during a drift, fragile corals, and a clearly marked no-entry
      conservation area.
    marine_life: Anthias, glassfish, groupers, batfish, blue-spotted stingrays, pufferfish, and triggerfish may
      be seen among the pinnacles and sandy slope.
  ru:
    summary: Дрифтовое погружение у внешней северной стороны Марса-Барайки, где окаймляющий риф и песчаное плато
      переходят в свал примерно на 25–30 м. Разнообразный маршрут образуют коралловые башни, крупные столовидные
      кораллы, горгонарии и небольшие сквозные проходы, доступные рекреационным дайверам. Погружения разрешены только
      на внешнем рифе, чтобы не тревожить охраняемые места гнездования внутри бухты.
    access: Наличие постоянной швартовки не предполагается; обычно погружение проводится с катера в дрейфе после
      проверки течения, с подбором за пределами закрытой зоны.
    hazards: Течение, глубина у свала, разделение группы во время дрейфа, хрупкие кораллы и чётко обозначенная
      природоохранная зона, вход в которую запрещён.
    marine_life: Среди коралловых башен и на песчаном склоне можно увидеть антиасов, стеклянных рыбок, груперов,
      платаксов, синепятнистых хвостоколов, иглобрюхов и спинорогов.
