content:
  en:
    summary: A Ras Mohammed sandy slope and reef section between Jackfish Alley and Shark Observatory, named for its garden-eel colony.
    access: Usually a boat dive; guided overland shore entry is also reported when park and sea conditions permit.
    hazards: Current, surge near the shallow entry, depth on the sandy slope, boat pickup and easily disturbed sand.
    marine_life: Garden eels are the defining feature; morays, rays and ordinary Red Sea reef fish may also occur.
  ru:
    summary: Участок песчаного склона и рифа в Рас-Мохаммеде между Джекфиш-Элли и Шарк-Обсерватори, названный по колонии садовых угрей.
    access: Обычно погружение выполняют с катера; при разрешении парка и подходящем состоянии моря также описан береговой вход с гидом.
    hazards: Течение, прибой у мелководного входа, глубина на песчаном склоне, подбор катером и легко взмучиваемый песок.
    marine_life: Главная особенность — садовые угри; также возможны мурены, скаты и обычные рифовые рыбы Красного моря.
