content:
  en:
    summary: A narrow local reef shelf that becomes a steep wall, noted for abundant pink soft coral.
    access: Normally a shallow boat drift.
    hazards: Very deep wall beyond recreational limits, current, buoyancy control and boat pickup.
    marine_life: Pink soft corals, reef fish, morays and occasional rays or pelagic fish.
  ru:
    summary: Узкая полка местного рифа переходит в крутую стену, известную розовыми мягкими кораллами.
    access: Обычно неглубокий дрифт с катера.
    hazards: Очень глубокая стена за пределами рекреационных глубин, течение, контроль плавучести и подбор катером.
    marine_life: Розовые мягкие кораллы, рифовые рыбы, мурены; возможны скаты и пелагические рыбы.
