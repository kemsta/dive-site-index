content:
  en:
    summary: A Taba Heights reef and sandy-bottom site with small coral pinnacles, used for locally supervised training and
      check dives.
    access: Boat access; use the mooring, route and pickup selected in the operator briefing.
    hazards: Boat traffic, navigation over sand, depth and fragile pinnacles require controlled buoyancy and supervision appropriate
      to the dive.
    marine_life: Small reef fish and coral-associated animals may occur around the pinnacles.
  ru:
    summary: Рифовый сайт Taba Heights с песчаным дном и небольшими коралловыми башнями, используемый для обучения и проверочных
      погружений под местным контролем.
    access: Доступ с лодки; используйте швартовку, маршрут и порядок подбора из брифинга оператора.
    hazards: Движение судов, навигация над песком, глубина и хрупкие башни требуют контроля плавучести и соответствующего
      сопровождения.
    marine_life: У башен возможны мелкие рифовые рыбы и связанная с кораллами фауна.
