content:
  en:
    summary: A Sharm local-coast reef marked by a fossil coral tower and a very deep vertical canyon or crack.
    access: Usually a guided boat drift; shore access is not assumed for general catalog use.
    hazards: The canyon extends far beyond recreational depth; current, wall exposure and boat pickup also require care.
    marine_life: Coral pinnacles, glassfish, clownfish, nudibranchs and ordinary wall-reef life.
  ru:
    summary: Местный риф Шарм-эш-Шейха, отмеченный ископаемой коралловой башней и очень глубоким вертикальным каньоном или трещиной.
    access: Обычно дрифт с катера и гидом; общий береговой доступ не предполагается.
    hazards: Каньон уходит далеко за пределы рекреационных глубин; также важны течение, открытая стена и подбор катером.
    marine_life: Коралловые башни, стеклянные рыбки, рыбы-клоуны, голожаберные моллюски и обычная фауна рифовой стены.
