content:
  en:
    summary: A rocky-entry site descending over sand from 3–4 m past a pinnacle to two reef profiles, both continuing beyond
      40 m.
    access: Short rocky shore entry followed by a sandy descent.
    hazards: Rocky entry and depth beyond 40 m for qualified divers; stay within certification limits.
    marine_life: Glassfish, a green anemone, shrimp, octopus, moray eels, occasional lobster, hunting fish and hawksbill turtles
      are reported.
  ru:
    summary: Маршрут с каменистым входом, спуском по песку с 3–4 м мимо пинакля и двумя рифовыми профилями, оба уходят глубже
      40 м.
    access: Короткий каменистый вход с берега, затем спуск по песку.
    hazards: Каменистый вход и глубины свыше 40 м для подготовленных дайверов; необходимо соблюдать пределы сертификации.
    marine_life: Упоминаются стеклянные рыбки, зелёная актиния, креветки, осьминоги, мурены, иногда лобстеры, охотящиеся рыбы
      и биссы.
