content:
  en:
    summary: Two disused desalination pipes, one reaching 12 m and the other 22 m, now colonised by hard and soft coral and
      used as cleaning stations.
    access: Shore dive; the pipes provide the main navigation reference.
    hazards: Avoid contact with the structure and camouflaged venomous fish.
    marine_life: Scorpionfish, occasional frogfish, anthias, batfish, jacks, snappers, octopus and torpedo rays are reported.
  ru:
    summary: 'Две неиспользуемые опреснительные трубы: одна доходит до 12 м, другая — до 22 м; сейчас они покрыты твёрдыми
      и мягкими кораллами и служат станциями очистки.'
    access: Береговое погружение; трубы служат основным ориентиром.
    hazards: Следует избегать контакта с конструкцией и замаскированными ядовитыми рыбами.
    marine_life: Упоминаются скорпены, иногда рыбы-лягушки, антиасы, платаксы, каранксы, луцианы, осьминоги и электрические
      скаты.
