content:
  en:
    summary: A relaxed local reef dive south of Naama Bay, following a gently sloping coral garden. The site is
      named for amphora fragments at about 28 m; long submersion has left them heavily encrusted and easy to overlook.
      The shallower slope offers an uncomplicated reef route, while the artefacts sit near the deeper end of a recreational
      profile.
    access: Usually dived from a day boat, either from a mooring or as a gentle drift according to the guide's current
      check.
    hazards: Depth while searching for the amphora fragments; occasional current; fragile coral and protected archaeological
      remains. Do not touch or remove artefacts.
    marine_life: Typical Red Sea reef fish and coral-garden life may be encountered; pelagic sightings are possible
      but not a defining feature.
  ru:
    summary: Спокойное погружение на местном рифе к югу от залива Наама-Бей проходит вдоль пологого кораллового
      сада. Сайт назван в честь фрагментов амфор, лежащих на глубине около 28 м; за долгое время под водой они сильно
      обросли и их легко не заметить. На мелководной части склона проходит несложный рифовый маршрут, а артефакты
      находятся у нижней границы рекреационного профиля.
    access: Обычно погружение выполняют с дневного катера — со стационарной швартовки или в режиме лёгкого дрейфа в
      зависимости от результатов проверки течения гидом.
    hazards: Глубина при поиске фрагментов амфор; периодическое течение; хрупкие кораллы и охраняемые археологические
      остатки. Не прикасайтесь к артефактам и не забирайте их.
    marine_life: Можно встретить типичных рифовых рыб Красного моря и обитателей кораллового сада; встречи с пелагическими
      видами возможны, но не являются характерной особенностью сайта.
