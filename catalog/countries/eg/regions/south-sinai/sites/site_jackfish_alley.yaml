content:
  en:
    summary: A Ras Mohammed drift route combining a shallow wall, sandy bays, coral gardens, and short light-filled
      swim-throughs. The first opening begins near 5 m, while a second route and coral pinnacles occupy the 5–15
      m range. The site's varied topography rewards a conservative route that avoids turning optional openings into
      unplanned overhead environments.
    access: Boat drift along the Ras Mohammed coast, normally with live pickup. Swim-throughs are optional and should
      be used only when included in the guide's briefing.
    hazards: Current, overhead sections, separation during the drift, boat traffic, scorpionfish, and fragile coral.
      Maintain visual contact with the exit in any swim-through.
    marine_life: Blue-spotted rays may rest on the sand; glassfish, scorpionfish, lionfish, fusiliers, and jackfish
      use the pinnacles and alley. Tuna or reef sharks may pass in the blue but are not guaranteed.
  ru:
    summary: Дрейфовый маршрут в Рас-Мохаммеде сочетает мелководную стенку, песчаные бухты, коралловые сады и короткие
      хорошо освещённые сквозные проходы. Первый проход начинается примерно на 5 м, а второй маршрут и коралловые
      башни расположены в диапазоне глубин 5–15 м. Разнообразный рельеф сайта лучше исследовать по консервативному
      маршруту, не превращая необязательные проходы в незапланированную надголовную среду.
    access: Дрейфовое погружение с лодки вдоль побережья Рас-Мохаммеда, обычно с подбором на ходу. Сквозные проходы
      необязательны, и пользоваться ими следует только тогда, когда они включены в брифинг гида.
    hazards: Течение, участки с надголовной средой, разделение группы во время дрейфа, движение судов, скорпены и
      хрупкие кораллы. В любом сквозном проходе сохраняйте визуальный контакт с выходом.
    marine_life: Голубопятнистые хвостоколы могут отдыхать на песке; стеклянные рыбки, скорпены, крылатки, фузилёры
      и каранксы держатся у коралловых башен и в проходе. В открытой воде могут появляться тунцы или рифовые акулы,
      но их встреча не гарантирована.
