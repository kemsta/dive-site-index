content:
  en:
    summary: An offshore Taba Heights reef, also shortened to Maxwell or Maxwell's, with an island-like reef profile.
    access: Boat access; descent and pickup should follow the operator plan for the offshore site.
    hazards: Open-water descent, depth, possible water movement and boat separation require appropriate gas and surface procedures.
    marine_life: Reef fish and larger passing animals may occur, but sightings vary.
  ru:
    summary: Морской риф Taba Heights с островным подводным профилем; название также сокращают до Maxwell или Maxwell’s.
    access: Доступ с лодки; спуск и подбор должны выполняться по плану оператора для морского сайта.
    hazards: Спуск в открытой воде, глубина, возможное движение воды и риск отделения от лодки требуют подходящего газового
      и поверхностного плана.
    marine_life: Возможны рифовые рыбы и проходящие крупные животные, но наблюдения различаются.
