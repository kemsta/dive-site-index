content:
  en:
    summary: The longest and narrowest of the four principal Tiran reefs, positioned between Thomas and Jackson.
      With no sheltered mooring area, it is normally dived as a one-way drift along a coral-covered wall. A deeper
      canyon and the turbulent saddle toward Jackson make route selection dependent on current and sea state.
    access: Boat drift with live pickup; the guide should select direction and endpoint after checking wind, current,
      and the northern saddle.
    hazards: Strong current, down-current or eddy risk near the saddle, surface chop, depth, open-water separation,
      and no sheltered mooring. Carry and know how to deploy an SMB.
    marine_life: Hard and soft corals, black coral colonies, morays, jacks, tuna, turtles, and eagle rays may be
      encountered. Sharks can pass the outer wall but sightings are unpredictable.
  ru:
    summary: Самый длинный и узкий из четырех основных рифов Тиранского пролива, расположенный между рифами Томас и
      Джексон. Поскольку защищенной зоны для швартовки нет, здесь обычно совершают одностороннее дрейфовое погружение
      вдоль покрытой кораллами стенки. Глубокий каньон и турбулентная седловина в направлении Джексона требуют выбирать
      маршрут с учетом течения и состояния моря.
    access: Дрейфовое погружение с катера с подбором в открытой воде; гид должен выбрать направление и конечную точку
      после проверки ветра, течения и северной седловины.
    hazards: Сильное течение, риск нисходящего течения или водоворота у седловины, волнение на поверхности, глубина,
      отделение группы в открытой воде и отсутствие защищенной швартовки. Имейте при себе SMB и умейте его выпускать.
    marine_life: Можно встретить твердые и мягкие кораллы, колонии черных кораллов, мурен, каранксов, тунцов, черепах и
      орляков. Вдоль внешней стенки могут проходить акулы, однако встречи с ними непредсказуемы.
