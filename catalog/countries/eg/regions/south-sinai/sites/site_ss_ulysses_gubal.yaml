content:
  en:
    summary: The broken remains of the nineteenth-century steamship Ulysses lie along the reef north of Bluff Point. It is a distinct wreck site and is not the Gubal Barge.
    access: Reached by boat or liveaboard when sea state and current permit; the route commonly follows the reef and wreckage.
    hazards: Current, surge, sharp or unstable wreckage, entanglement, depth variation, and boat traffic require a site-specific briefing. Penetration should not be assumed.
    marine_life: Coral growth and reef fish use the scattered structure and adjacent reef; larger encounters are variable.
  ru:
    summary: Разрушенные остатки парохода XIX века «Улисс» лежат вдоль рифа к северу от Блафф-Пойнта. Это самостоятельный рэк-сайт, не являющийся баржей Губал.
    access: Доступ с лодки или сафари-бота при подходящем состоянии моря и течении; маршрут обычно проходит вдоль рифа и обломков.
    hazards: Течение, раскачка от волн, острые или неустойчивые обломки, риск запутывания, перепады глубины и движение судов требуют локального брифинга. Проникновение не следует считать
      частью обычного маршрута.
    marine_life: Обломки и соседний риф покрыты кораллами и населены рифовыми рыбами; встречи с крупными животными непредсказуемы.
