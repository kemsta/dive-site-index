content:
  en:
    summary: The northernmost of Tiran's four principal reefs, combining a steep wall, coral gardens, and current-swept
      corners. Recreational routes normally stay within about 0–30 m, although the wall and the remains of the Lara
      continue deeper. The exact route depends strongly on wind, surface conditions, and current direction.
    access: Boat dive from the sheltered south side or a planned drift around a corner; live pickup may be required.
      The guide should perform both current and surface-condition checks.
    hazards: Strong or changing current, surface chop, reef corners, blue-water separation, boat traffic, depth,
      and the deeper Lara wreckage. Carry and know how to deploy an SMB.
    marine_life: Dense schools of anthias, wrasses, and fusiliers, plus turtles and other reef life, are common
      subjects. Large pelagic animals may pass through but sightings are never guaranteed.
  ru:
    summary: Самый северный из четырёх основных рифов Тирана, сочетающий крутую стенку, коралловые сады и углы,
      омываемые течением. Рекреационные маршруты обычно проходят в пределах примерно 0–30 м, хотя стенка и остатки
      «Лары» продолжаются глубже. Точный маршрут в значительной степени зависит от ветра, состояния поверхности и
      направления течения.
    access: Погружение с лодки с защищённой южной стороны или запланированный дрейф вокруг угла рифа; может потребоваться
      подбор на ходу. Гид должен проверить как течение, так и состояние поверхности.
    hazards: Сильное или меняющееся течение, волнение на поверхности, углы рифа, отделение от группы в открытой воде,
      движение судов, глубина и более глубокие обломки «Лары». Имейте при себе буй SMB и умейте его выпускать.
    marine_life: Плотные стаи антиасов, губанов и фузилёров, а также черепахи и другие обитатели рифа часто становятся
      объектами наблюдения. Крупные пелагические животные могут проходить мимо, но встречи с ними никогда не гарантированы.
