content:
  en:
    summary: A shore-accessible house reef in central Dahab used for training, refresher dives, ordinary reef dives, and night dives. The wider Masbat Bay includes sand and seagrass as well as reef features.
    access: Shore entry from the Lighthouse area in Dahab; exact entry arrangements depend on the operating dive centre and local waterfront access.
    hazards: Training use does not remove the need to assess entry conditions, local traffic, visibility, and the planned depth.
    marine_life: The reef, sand, and seagrass habitats support a range of small reef animals; individual sightings are not guaranteed.
  ru:
    summary: Доступный с берега домашний риф в центре Дахаба, используемый для обучения, восстановительных и обычных рифовых погружений, а также ночных дайвов. В более широкой бухте Масбат встречаются песок и морская трава наряду с рифовыми образованиями.
    access: Вход с берега в районе Лайтхауса в Дахабе; конкретная организация входа зависит от дайв-центра и местного доступа к берегу.
    hazards: Использование для обучения не отменяет необходимости оценить условия входа, местное движение, видимость и запланированную глубину.
    marine_life: Риф, песок и морская трава образуют среду для разнообразных небольших рифовых животных; конкретные встречи не гарантированы.
