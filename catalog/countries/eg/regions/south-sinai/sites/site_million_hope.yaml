content:
  en:
    summary: The upright remains of the 174.6 m bulk carrier Million Hope lie beside the reef north of Nabq, with
      the hull on the seabed at about 20 m and parts of the superstructure historically above the surface. The remains
      of the smaller Hey Daroma are compressed beneath or beside the larger wreck. Open cargo holds, machinery,
      and the reef–hull corridor make this a substantial wreck site even without penetration.
    access: Boat access only, subject to local authorization and safe sea state; use the operator's mooring or live-drop
      procedure rather than approaching the exposed structure independently.
    hazards: Sharp and unstable metal, entanglement, surge, restricted visibility inside the wreck, overhead environments,
      large scale, and possible current. Penetration requires appropriate training, equipment, and a site-specific
      plan.
    marine_life: Reef fish and encrusting life use the hull and the narrow space beside the reef; the wreck's scale
      and structure are the principal attractions.
  ru:
    summary: Стоящие на ровном киле остатки балкера «Миллион Хоуп» длиной 174,6 м лежат у рифа к северу от Набка;
      корпус находится на дне на глубине около 20 м, а части надстройки исторически возвышались над поверхностью.
      Остатки меньшего судна «Хей Дарома» сплющены под более крупным рэком или рядом с ним. Открытые грузовые трюмы,
      механизмы и коридор между рифом и корпусом делают этот сайт значительным местом рэк-дайвинга даже без проникновения.
    access: Доступ только с лодки при наличии местного разрешения и безопасном состоянии моря; используйте швартовку
      оператора или предусмотренную им процедуру входа с ходу, а не пытайтесь самостоятельно приблизиться к конструкции,
      открытой воздействию моря.
    hazards: Острый и неустойчивый металл, риск запутывания, раскачка от волн, ограниченная видимость внутри судна, надголовная
      среда, большой масштаб объекта и возможное течение. Для проникновения необходимы соответствующая подготовка,
      снаряжение и план, составленный с учётом особенностей сайта.
    marine_life: Рифовые рыбы и обрастающие организмы населяют корпус и узкое пространство между ним и рифом; главные
      достопримечательности сайта — масштаб и конструкция затонувшего судна.
