content:
  en:
    summary: The upright remains of the 174.6 m bulk carrier Million Hope lie beside the reef north of Nabq, with
      the hull on the seabed at about 20 m and parts of the superstructure historically above the surface. The remains
      of the smaller Hey Daroma are compressed beneath or beside the larger wreck. Open cargo holds, machinery,
      and the reef–hull corridor make this a substantial wreck site even without penetration.
    access: Boat access only, subject to local authorization and safe sea state; use the operator's mooring or live-drop
      procedure rather than approaching the exposed structure independently.
    hazards: Sharp and unstable metal, entanglement, surge, restricted visibility inside the wreck, overhead environments,
      large scale, and possible current. Penetration requires appropriate training, equipment, and a site-specific
      plan.
    marine_life: Reef fish and encrusting life use the hull and the narrow space beside the reef; the wreck's scale
      and structure are the principal attractions.
