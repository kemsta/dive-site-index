content:
  en:
    summary: A tidal passage through Sha'ab Mahmoud, connecting the outer reef with a sheltered lagoon. A common
      route follows the outer wall and coral slope before using the current to pass through the narrow channel;
      typical diving is concentrated in roughly 5–20 m although the wider site extends shallower and deeper. The
      quality and safety of the dive depend more on tide timing than on distance covered.
    access: Normally a zodiac drop on the outer reef followed by a timed drift through the passage toward the lagoon
      and liveaboard. The guide must choose the route from the actual tidal flow.
    hazards: Strong and reversing tidal current, being swept toward open water, difficult pickup in rough conditions,
      shallow surge, separation, and boat traffic. Carry an SMB and do not enter the passage against the briefing.
    marine_life: Soft corals, table corals, gorgonians, turtles, and varied reef fish may be encountered; flashlight
      fish are reported on suitable night dives.
