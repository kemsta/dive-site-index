content:
  en:
    summary: A tidal passage through Sha'ab Mahmoud, connecting the outer reef with a sheltered lagoon. A common
      route follows the outer wall and coral slope before using the current to pass through the narrow channel;
      typical diving is concentrated in roughly 5–20 m although the wider site extends shallower and deeper. The
      quality and safety of the dive depend more on tide timing than on distance covered.
    access: Normally a zodiac drop on the outer reef followed by a timed drift through the passage toward the lagoon
      and liveaboard. The guide must choose the route from the actual tidal flow.
    hazards: Strong and reversing tidal current, being swept toward open water, difficult pickup in rough conditions,
      shallow surge, separation, and boat traffic. Carry an SMB and do not enter the passage against the briefing.
    marine_life: Soft corals, table corals, gorgonians, turtles, and varied reef fish may be encountered; flashlight
      fish are reported on suitable night dives.
  ru:
    summary: Приливный проход через Шааб-Махмуд, соединяющий внешний риф с защищенной лагуной. Обычный маршрут идет
      вдоль внешней стенки и кораллового склона, после чего течение используется для прохождения узкого канала; как
      правило, погружение проходит примерно на 5–20 м, хотя в пределах всего дайв-сайта есть и меньшие, и большие
      глубины. Качество и безопасность погружения в большей степени зависят от выбора времени относительно прилива,
      чем от пройденного расстояния.
    access: Обычно высадка с зодиака производится у внешнего рифа, после чего следует рассчитанный по приливу дрейф
      через проход к лагуне и сафари-боту. Гид должен выбирать маршрут по фактическому направлению приливного течения.
    hazards: Сильное и меняющее направление приливное течение, риск сноса в открытое море, сложный подбор при волнении,
      прибойное течение на мелководье, разделение группы и движение катеров. Имейте при себе SMB и не входите в проход
      вопреки указаниям брифинга.
    marine_life: Можно встретить мягкие и столовые кораллы, горгонарии, черепах и разнообразных рифовых рыб; во время
      подходящих ночных погружений отмечаются рыбы-фонареглазы.
