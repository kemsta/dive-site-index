content:
  en:
    summary: The Kingston is a British cargo steamer wrecked at Shag Rock in 1881, with the surviving structure
      extending approximately from 4 to 17 m. The stern, propeller, boilers, and open hull remain visible, while
      the damaged bow merges into the shallow reef. Bright natural light and coral growth make the exterior accessible,
      but the wreck still requires careful buoyancy and respect for fragile structure.
    access: Boat or liveaboard dive at Shag Rock, using a mooring or zodiac/live pickup according to conditions.
    hazards: Sharp and weakened wreck material, surge and current across the reef, shallow boat traffic, entanglement,
      and overhead risk inside the hull. Penetration should not be assumed from the open appearance.
    marine_life: Surgeonfish, rabbitfish, nudibranchs, groupers, snappers, turtles, and other reef life may be encountered;
      dolphins are reported in the wider area but are not predictable.
