content:
  en:
    summary: The Kingston is a British cargo steamer wrecked at Shag Rock in 1881, with the surviving structure
      extending approximately from 4 to 17 m. The stern, propeller, boilers, and open hull remain visible, while
      the damaged bow merges into the shallow reef. Bright natural light and coral growth make the exterior accessible,
      but the wreck still requires careful buoyancy and respect for fragile structure.
    access: Boat or liveaboard dive at Shag Rock, using a mooring or zodiac/live pickup according to conditions.
    hazards: Sharp and weakened wreck material, surge and current across the reef, shallow boat traffic, entanglement,
      and overhead risk inside the hull. Penetration should not be assumed from the open appearance.
    marine_life: Surgeonfish, rabbitfish, nudibranchs, groupers, snappers, turtles, and other reef life may be encountered;
      dolphins are reported in the wider area but are not predictable.
  ru:
    summary: «Кингстон» — британский грузовой пароход, потерпевший крушение у Шаг-Рока в 1881 году; сохранившиеся
      конструкции простираются примерно от 4 до 17 м. Корма, гребной винт, котлы и открытый корпус всё ещё видны,
      а повреждённая носовая часть сливается с мелководным рифом. Яркий естественный свет и коралловые обрастания
      делают внешний осмотр доступным, однако у затонувшего судна по-прежнему необходимы точный контроль плавучести
      и бережное отношение к хрупким конструкциям.
    access: Погружение с лодки или сафари-бота у Шаг-Рока со швартовки либо с использованием зодиака или подбора на
      ходу — в зависимости от условий.
    hazards: Острые и ослабленные элементы судна, раскачка от волн и течение над рифом, движение лодок на мелководье, риск
      запутывания и надголовная среда внутри корпуса. Открытый вид конструкции не означает, что проникновение безопасно.
    marine_life: Можно встретить рыб-хирургов, сиганов, голожаберных моллюсков, груперов, луцианов, черепах и других
      обитателей рифа; в более обширном районе отмечают дельфинов, но предсказать их появление невозможно.
