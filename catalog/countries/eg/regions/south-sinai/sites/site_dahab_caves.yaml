content:
  en:
    summary: The southernmost commonly drive-accessible Dahab site, focused on two large open-fronted reef overhangs beside a sandy slope and boulder pinnacles.
    access: Giant-stride shore entry from the reef ledge; return to the same ledge or use a planned drift exit farther along the shore.
    hazards: Entry and exit become unsafe in waves and are best attempted in calm, suitable-tide conditions; use a torch in the overhangs and avoid treating them as unrestricted caves.
    marine_life: Anthias and bannerfish gather beneath the roofs; groupers, scorpionfish, morays, nudibranchs, flatworms, garden eels and occasional turtles or guitarfish are reported.
  ru:
    summary: 'Самый южный из обычно доступных на машине сайтов Дахаба: два крупных открытых навеса под рифом у песчаного склона и валунных пиннаклов.'
    access: Шаг в воду с рифового уступа; выход на тот же уступ либо по заранее спланированному дрейфовому маршруту дальше по берегу.
    hazards: При волне вход и выход опасны и допустимы только при спокойном море и подходящем уровне воды; под навесами нужен фонарь, их нельзя считать неограниченно безопасными пещерами.
    marine_life: Под сводами собираются антиасы и вымпельные рыбы; отмечают груперов, скорпен, мурен, голожаберных, плоских червей, садовых угрей, иногда черепах и гитарных скатов.
