content:
  en:
    summary: A south-Dahab shore site named for three shallow sandy reef pools linked by coral saddles, opening onto a slope, pinnacles and coral garden.
    access: Shore entry through the linked pools; high tide makes passage over the saddles easier and reduces reef contact.
    hazards: Low tide makes the shallow pool passages awkward and increases the risk of contacting coral; precise buoyancy is needed in the confined entry.
    marine_life: Napoleon wrasse, triggerfish, butterflyfish, morays, turtles, glassfish, crocodilefish, scorpionfish and octopus are reported around the pools and outer reef.
  ru:
    summary: Южный береговой сайт, названный по трём мелким песчаным бассейнам, соединённым коралловыми седловинами и выходящим к склону, пиннаклам и саду.
    access: Вход с берега через связанные бассейны; прилив облегчает проход через седловины и снижает риск касания рифа.
    hazards: При отливе мелкие проходы неудобны и возрастает риск контакта с кораллом; во входной зоне нужна точная плавучесть.
    marine_life: В районе бассейнов и внешнего рифа отмечают наполеонов, спинорогов, рыб-бабочек, мурен, черепах, стеклянных и крокодиловых рыб, скорпен и осьминогов.
