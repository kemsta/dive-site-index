content:
  en:
    summary: The northernmost Sharm local-coast site, where a broad sandy plateau with coral heads and sea fans approaches the Tiran passage.
    access: Boat drift after checking current direction.
    hazards: Reversing or strengthening current near the passage, depth, shipping/boat traffic and separation.
    marine_life: Sea fans, table and Porites corals, turtles, rays and passing pelagic fish.
  ru:
    summary: 'Самый северный местный сайт Шарм-эш-Шейха: широкое песчаное плато с коралловыми головами и горгонариями подходит к проходу Тиран.'
    access: Дрифт с катера после проверки направления течения.
    hazards: Меняющееся или усиливающееся течение у прохода, глубина, судоходство и разделение группы.
    marine_life: Горгонарии, столовидные кораллы и пориты, черепахи, скаты и проходящие пелагические рыбы.
