content:
  en:
    summary: A northern local-coast reef directly south of Ras Ghamila, with a sandy plateau, coral heads, sea fans and deeper wall sections.
    access: Generally a guided boat drift; some profiles can return toward the entry only when current allows.
    hazards: Potentially strong current around the corner, depth on deeper walls, separation and boat pickup.
    marine_life: Coral heads, gorgonians, turtles, morays, rays and occasional large pelagic fish.
  ru:
    summary: Северный местный риф непосредственно к югу от Рас-Гамилы с песчаным плато, коралловыми головами, горгонариями и более глубокими стенами.
    access: Обычно дрифт с катера и гидом; возврат к точке входа возможен только при подходящем течении.
    hazards: Возможное сильное течение у поворота, глубина на стенах, разделение группы и подбор катером.
    marine_life: Коралловые головы, горгонарии, черепахи, мурены, скаты и иногда крупные пелагические рыбы.
