content:
  en:
    summary: A timber-cargo freighter wreck on the northwestern side of Sha'ab Abu Nuhas. Giannis and Ghiannis are transliteration variants for the same wreck.
    access: Reached by boat or liveaboard; the exposed reef face makes access dependent on sea state and operator procedure.
    hazards: Current, surge, listing structure, sharp or unstable metal, entanglement, boat traffic, and overhead spaces require a wreck-specific plan. Penetration requires appropriate
      training and equipment.
    marine_life: Reef fish and encrusting life occupy the stern, machinery, and surrounding debris; sightings vary.
  ru:
    summary: Рэк грузового судна с древесиной на северо-западной стороне Шааб-Абу-Нухаса. Giannis и Ghiannis — варианты транслитерации названия одного рэка.
    access: Доступ с лодки или сафари-бота; открытая сторона рифа делает погружение зависимым от состояния моря и процедур оператора.
    hazards: Течение, раскачка, наклонённые конструкции, острый или неустойчивый металл, риск запутывания, движение судов и надголовная среда требуют рэк-плана. Для проникновения нужны
      соответствующая подготовка и снаряжение.
    marine_life: Кормовая часть, механизмы и обломки населены рифовыми рыбами и обрастающими организмами; наблюдения меняются.
