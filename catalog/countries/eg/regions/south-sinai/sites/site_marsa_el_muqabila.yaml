content:
  en:
    summary: A coral-rich plateau dive south of Taba Heights, shared in Taba and Taba Heights itineraries under several transliterations.
    access: Boat access; use the route, descent and pickup procedure specified by the local operator.
    hazards: Surface traffic, possible water movement, depth and navigation across the plateau require a locally briefed plan.
    marine_life: Coral-associated fish and rays may occur, but encounters are not assured.
  ru:
    summary: Дайв-сайт на коралловом плато к югу от Taba Heights, входящий в маршруты Табы и Taba Heights под несколькими
      вариантами транслитерации.
    access: Доступ с лодки; используйте маршрут, спуск и порядок подбора, указанные местным оператором.
    hazards: Движение судов, возможное движение воды, глубина и навигация по плато требуют локального плана.
    marine_life: Возможны рифовые рыбы и скаты, но конкретные встречи не гарантированы.
