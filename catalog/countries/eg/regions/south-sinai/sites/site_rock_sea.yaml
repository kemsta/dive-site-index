content:
  en:
    summary: A Rock Sea camp shore reef with a coral garden, an initial drop-off from about 18 to 45 m and a second slope
      and drop-off into technical depths beyond 100 m.
    access: Enter from Rock Sea camp through a natural break in the reef table.
    hazards: Deep drop-offs and a technical canyon; only the shallow coral garden is appropriate for entry-level divers.
    marine_life: Cleaner shrimp, partner gobies, nudibranchs and seahorses in shallow seagrass are reported.
  ru:
    summary: 'Береговой риф у лагеря Rock Sea: коралловый сад, первый свал примерно с 18 до 45 м, затем второй склон и свал
      на технические глубины свыше 100 м.'
    access: Вход из лагеря Rock Sea через естественный разрыв в рифовой платформе.
    hazards: Глубокие свалы и технический каньон; для начинающих подходит только мелководный коралловый сад.
    marine_life: Упоминаются креветки-чистильщики, бычки с креветками, голожаберные моллюски и морские коньки на мелководье
      с морской травой.
