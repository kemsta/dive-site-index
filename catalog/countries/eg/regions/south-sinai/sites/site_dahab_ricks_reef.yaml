content:
  en:
    summary: A distinct entry north of the Canyon used for a shallow southbound drift along coral slope, wall and pinnacles to the Canyon lagoon.
    access: Shore entry through a small opening in the reef table; the standard route drifts south and exits through the Canyon lagoon.
    hazards: This is normally a one-way drift, so current direction, gas reserve and the Canyon exit must be checked before entry.
    marine_life: Salad and table corals, anthias, groupers, pufferfish, parrotfish and the fish-rich former Fish Bowl area are recurring features.
  ru:
    summary: Отдельный вход к северу от Canyon для мелководного южного дрейфа вдоль кораллового склона, стенки и пиннаклов к лагуне Canyon.
    access: Вход с берега через небольшое отверстие в рифовой платформе; стандартный маршрут идёт на юг и выходит через лагуну Canyon.
    hazards: Обычно это односторонний дрейф, поэтому до входа нужно проверить направление течения, запас газа и доступность выхода Canyon.
    marine_life: Характерны салатовые и столовые кораллы, антиасы, груперы, иглобрюхи, рыбы-попугаи и богатая рыбой зона бывшего Fish Bowl.
