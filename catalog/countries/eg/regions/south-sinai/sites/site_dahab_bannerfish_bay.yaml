content:
  en:
    summary: A sheltered central-Dahab bay combining seagrass, sand patches and small reefs, valued for macro life, training and night dives.
    access: Walk-in shore access using the central waterfront/Lighthouse-side entry; the area can also start a southbound drift to Mashraba.
    hazards: Fine sand and seagrass are easily disturbed; maintain buoyancy and watch for camouflaged venomous bottom fish rather than standing or kneeling.
    marine_life: Bannerfish, seahorses, ghost pipefish, seamoths, frogfish, flounders, morays, shrimps, scorpionfish, octopus and a resident turtle are reported.
  ru:
    summary: Защищённая бухта в центре Дахаба с морской травой, песчаными участками и мини-рифами; ценится за макрожизнь, обучение и ночные погружения.
    access: Пеший вход с центральной набережной со стороны Lighthouse; отсюда также начинают южный дрейф к Mashraba.
    hazards: Ил и морская трава легко взмучиваются; сохраняйте плавучесть и не становитесь на дно из-за замаскированных ядовитых донных рыб.
    marine_life: Описаны вымпельные рыбы, морские коньки, рыбы-призраки, морские мотыльки, удильщики, камбалы, мурены, креветки, скорпены, осьминоги и местная черепаха.
