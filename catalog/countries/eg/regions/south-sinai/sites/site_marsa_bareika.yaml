content:
  en:
    summary: A broad, naturally sheltered bay inside Ras Mohammed National Park, with shallow sandy areas and reef
      features extending toward a canyon that reaches approximately 30 m. Parts of the bay's beaches are protected
      turtle-nesting habitat, so access and route restrictions must be respected. This record retains the published/mapped
      site coordinate while also preserving the Garmin point from the user's dive.
    access: Boat access under local operator and national-park procedures; follow the guide's designated entry,
      exit, and restricted-area briefing.
    hazards: Protected and restricted zones, possible current outside the sheltered bay, boat traffic, and depth
      in the canyon. Do not approach closed nesting beaches.
    marine_life: The sandy plateau can support small benthic life such as nudibranchs and shrimp; glassfish and
      lionfish are reported around the canyon. Rays and larger visitors are possible, not guaranteed.
  ru:
    summary: Широкая естественно защищённая бухта в национальном парке Рас-Мохаммед с мелководными песчаными участками
      и рифовыми образованиями, продолжающимися к каньону глубиной около 30 м. Некоторые пляжи бухты являются охраняемыми
      местами гнездования черепах, поэтому необходимо соблюдать ограничения на доступ и маршруты. В этой записи сохранены
      как опубликованные или нанесённые на карту координаты сайта, так и точка Garmin с погружения пользователя.
    access: Доступ с лодки в соответствии с процедурами местного оператора и национального парка; следуйте указаниям
      гида на брифинге о назначенных точках входа и выхода и закрытых зонах.
    hazards: Охраняемые и закрытые зоны, возможное течение за пределами защищённой бухты, движение судов и глубина
      в каньоне. Не приближайтесь к закрытым для посещения пляжам, где гнездятся черепахи.
    marine_life: На песчаном плато могут обитать небольшие донные животные, например голожаберные моллюски и креветки;
      у каньона отмечают стеклянных рыбок и крылаток. Встречи со скатами и более крупными животными возможны, но не
      гарантированы.
