content:
  en:
    summary: A northern Sharm local reef with a coral-encrusted wall descending to about 16 m. Small swim-throughs
      and narrow recesses interrupt the wall, while a sandy slope below supports a garden-eel area. The compact
      topography suits a controlled local reef dive when current is mild.
    access: Boat or locally arranged shore access; follow the guide's plan for a mooring return or short drift along
      the wall.
    hazards: Overhead risk in narrow recesses, disorientation in swim-throughs, fragile coral, local current, boat
      traffic, and depth on the sandy slope. Enter openings only when included in the briefing.
    marine_life: Glassfish gather beneath table corals, garden eels occupy the sand, and mixed Red Sea reef fish
      use the wall and recesses.
  ru:
    summary: Местный риф в северной части Шарм-эш-Шейха с покрытой кораллами стеной, уходящей примерно до 16 м.
      Стену пересекают небольшие сквозные проходы и узкие углубления, а на песчаном склоне ниже обитает колония
      садовых угрей. Компактный рельеф подходит для спокойного погружения на местном рифе при слабом течении.
    access: Доступ с катера или организованный на месте вход с берега; следуйте плану гида, предусматривающему
      возвращение к швартовке либо короткий дрейф вдоль стены.
    hazards: Риск надголовной среды в узких углублениях, потеря ориентации в сквозных проходах, хрупкие кораллы,
      местное течение, движение катеров и глубина на песчаном склоне. Заходите в проёмы только в том случае, если
      это предусмотрено брифингом.
    marine_life: Под столовидными кораллами собираются стеклянные рыбки, в песке обитают садовые угри, а стену и
      углубления населяют разнообразные рифовые рыбы Красного моря.
