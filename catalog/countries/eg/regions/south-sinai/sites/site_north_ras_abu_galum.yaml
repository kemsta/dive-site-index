content:
  en:
    summary: North Ras Abu Galum is the northern named dive sector, distinguished from the southern site and characterised
      by large coral blocks and reef growth.
    access: Reached by boat or by a remote coastal approach followed by shore entry; local transport and the entry route must
      be arranged in advance.
    hazards: Remote access, shore-entry conditions, navigation and fragile coral require a conservative guided plan within
      training limits.
    marine_life: Hard and soft corals and ordinary Red Sea reef fish are described; specific animal encounters vary.
  ru:
    summary: Северный Рас-Абу-Галум — именованный северный сектор погружений, отдельный от южного сайта и отличающийся крупными
      коралловыми блоками и рифовыми образованиями.
    access: Доступ с лодки либо после удалённого перехода вдоль берега с входом с берега; транспорт и маршрут входа необходимо
      согласовать заранее.
    hazards: Удалённый доступ, условия берегового входа, навигация и хрупкие кораллы требуют консервативного маршрута с гидом
      в пределах подготовки.
    marine_life: Описаны твёрдые и мягкие кораллы и обычные рифовые рыбы Красного моря; конкретные встречи различаются.
