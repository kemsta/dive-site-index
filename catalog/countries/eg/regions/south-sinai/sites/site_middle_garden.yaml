content:
  en:
    summary: The sheltered central Gardens site, with a broad sandy bottom scattered with coral heads and several mooring routes.
    access: Normally a boat mooring dive and commonly used for check or training dives.
    hazards: Boat traffic, fragile coral, navigation among moorings and depth toward the bay edge.
    marine_life: Blue-spotted rays, reef fish, morays and small life around scattered coral heads.
  ru:
    summary: Защищённый центральный сайт Gardens с широким песчаным дном, отдельными коралловыми головами и несколькими маршрутами от швартовок.
    access: Обычно погружение со швартовки; часто используется для чек-дайвов и обучения.
    hazards: Движение катеров, хрупкие кораллы, навигация среди швартовок и глубина к краю бухты.
    marine_life: Синепятнистые хвостоколы, рифовые рыбы, мурены и мелкая фауна у коралловых голов.
