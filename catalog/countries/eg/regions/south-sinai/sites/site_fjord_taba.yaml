content:
  en:
    summary: A named Taba dive at the coastal fjord, where reef terrain continues toward a deeper circular depression.
    access: Local sources describe both shore and boat approaches; use the entry and route selected in the local briefing.
    hazards: Depth changes, the depression, surface traffic and conditions near the bay mouth require conservative planning.
    marine_life: Reef fish and small coral-associated animals may occur around the coral and rocky terrain.
  ru:
    summary: Именованный дайв-сайт Табы у прибрежного фьорда, где рифовый рельеф ведёт к более глубокой округлой впадине.
    access: Местные источники описывают доступ с берега и с лодки; используйте вход и маршрут из локального брифинга.
    hazards: Перепады глубины, впадина, движение судов и условия у выхода из бухты требуют консервативного планирования.
    marine_life: На коралловом и скальном рельефе возможны рифовые рыбы и мелкая донная фауна.
