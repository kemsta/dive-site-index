  en:
    summary: A southern Myserique dive over a gradual coral-covered slope to 20 m, with intact table, brain and fan corals.
    access: Shore access is consistent with the local Myserique area description; the exact entry is not separately detailed.
    hazards: Current is reported as rare; avoid contact with the intact coral slope.
    marine_life: Octopus, blue-spotted rays, moray eels, Red Sea walkman and occasional eagle rays are reported.
  ru:
    summary: Южный маршрут Myserique по пологому коралловому склону до 20 м с сохранившимися столовыми, мозговыми и веерными
      кораллами.
    access: Береговой доступ соответствует описанию района Myserique; отдельная точка входа подробно не указана.
    hazards: Течение отмечается редко; следует избегать контакта с неповреждённым коралловым склоном.
    marine_life: Упоминаются осьминоги, синепятнистые хвостоколы, мурены, красноморский уокман и иногда орляки.
