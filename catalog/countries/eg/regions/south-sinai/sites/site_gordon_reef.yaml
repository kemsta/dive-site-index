content:
  en:
    summary: The southernmost and broadest of Tiran's four principal reefs. A sheltered sandy plateau and hard-coral
      garden occupy the south and southwest, while the edges fall into deeper water. The stranded Loullia on the
      northern side is a conspicuous surface landmark, not the focus of a conventional wreck penetration dive.
    access: Usually entered from a boat on the sheltered southern side, either from a fixed mooring or as a controlled
      drift according to the current.
    hazards: Changing current around the reef corners, surface chop, depth at the drop-off, separation, boat traffic,
      and sharp or unstable material near the stranded wreck. Carry an SMB for drift plans.
    marine_life: Blue-spotted stingrays, goatfish, butterflyfish, parrotfish, and other reef fish use the sand and
      coral plateau. Eagle rays, mantas, groupers, or reef sharks may pass the drop-off but are not guaranteed.
  ru:
    summary: Самый южный и широкий из четырёх основных рифов Тирана. На юге и юго-западе расположены защищённое
      песчаное плато и сад твёрдых кораллов, а по краям риф уходит в более глубокую воду. Севшая на мель «Луллия»
      на северной стороне служит заметным ориентиром на поверхности, но не является целью обычного погружения с
      проникновением на затонувшее судно.
    access: Обычно вход выполняют с лодки с защищённой южной стороны — со стационарной швартовки или в режиме контролируемого
      дрейфа в зависимости от течения.
    hazards: Меняющееся течение у углов рифа, волнение на поверхности, глубина у свала, разделение группы, движение
      судов, а также острые или неустойчивые элементы возле севшего на мель судна. При дрейфовых погружениях имейте
      при себе буй SMB.
    marine_life: Голубопятнистые хвостоколы, барабули, рыбы-бабочки, рыбы-попугаи и другие рифовые рыбы обитают на
      песке и коралловом плато. У свала могут проходить орляки, манты, груперы или рифовые акулы, но их появление не
      гарантировано.
