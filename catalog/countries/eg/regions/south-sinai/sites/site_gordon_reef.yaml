content:
  en:
    summary: The southernmost and broadest of Tiran's four principal reefs. A sheltered sandy plateau and hard-coral
      garden occupy the south and southwest, while the edges fall into deeper water. The stranded Loullia on the
      northern side is a conspicuous surface landmark, not the focus of a conventional wreck penetration dive.
    access: Usually entered from a boat on the sheltered southern side, either from a fixed mooring or as a controlled
      drift according to the current.
    hazards: Changing current around the reef corners, surface chop, depth at the drop-off, separation, boat traffic,
      and sharp or unstable material near the stranded wreck. Carry an SMB for drift plans.
    marine_life: Blue-spotted stingrays, goatfish, butterflyfish, parrotfish, and other reef fish use the sand and
      coral plateau. Eagle rays, mantas, groupers, or reef sharks may pass the drop-off but are not guaranteed.
