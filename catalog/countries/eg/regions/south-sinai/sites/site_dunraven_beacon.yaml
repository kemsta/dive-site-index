content:
  en:
    summary: The Dunraven is an iron steamship lost in 1876 and now lying upside down beside the reef at Sha'ab
      Mahmoud. The bow is around 17 m and the stern about 30 m; the broken midships area, keel, propeller, and coral-covered
      hull provide a complete exterior route. A lit swim-through exists in the aft section, but any overhead route
      should be treated as wreck penetration rather than an automatic part of the dive.
    access: Boat dive near Beacon Rock/Sha'ab Mahmoud using an operator mooring or controlled drop and pickup. Follow
      the guide's route because the Garmin point may reflect the boat position rather than the wreck's centre.
    hazards: Overhead environment, sharp and corroded metal, entanglement, silt, depth, current, and boat traffic.
      Avoid the front interior section identified as unsuitable for entry by the wreck source.
    marine_life: Soft coral and other encrusting growth cover parts of the hull; lionfish and varied reef fish can
      shelter around the structure.
  ru:
    summary: Dunraven — железный пароход, затонувший в 1876 году и ныне лежащий вверх килем у рифа Шааб-Махмуд. Нос
      находится примерно на 17 м, а корма — около 30 м; разрушенная средняя часть, киль, винт и покрытый кораллами
      корпус позволяют проложить полный внешний маршрут. В кормовой части есть освещенный сквозной проход, однако
      любой маршрут под перекрытием следует считать проникновением в затонувшее судно, а не обязательной частью
      погружения.
    access: Погружение с катера у Бикон-Рок/Шааб-Махмуд с использованием швартовки оператора либо контролируемой
      высадки и подбора. Следуйте маршруту гида, поскольку точка Garmin может соответствовать положению катера, а не
      центру затонувшего судна.
    hazards: Надголовная среда, острый и корродированный металл, риск запутывания, ил, глубина, течение и движение
      катеров. Не входите в переднюю внутреннюю секцию, которую источник по этому затонувшему судну считает непригодной
      для проникновения.
    marine_life: Части корпуса покрыты мягкими кораллами и другими обрастающими организмами; вокруг конструкции могут
      укрываться крылатки и разнообразные рифовые рыбы.
