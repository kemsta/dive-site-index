content:
  en:
    summary: A named Assalah Bay shore site where a pale sandy slope and adjacent reef support a large garden-eel colony.
    access: Shore entry across a broad reef platform and through a narrow channel; operators recommend high tide to avoid reef contact.
    hazards: The exposed entry can become difficult in wind, waves or strong current; avoid crossing the living reef on foot.
    marine_life: Garden eels are the signature attraction; barracuda, butterflyfish, morays, rays and ghost pipefish are also reported, alongside hard and soft corals.
  ru:
    summary: 'Береговой дайв-сайт в бухте Ассала: светлый песчаный склон и соседний риф с большой колонией садовых угрей.'
    access: Вход с берега через широкую рифовую платформу и узкий канал; операторы рекомендуют прилив, чтобы не задевать риф.
    hazards: При ветре, волне или сильном течении вход и выход осложняются; нельзя идти по живому рифу.
    marine_life: Главная особенность — садовые угри; также отмечают барракуд, рыб-бабочек, мурен, скатов и рыб-призраков среди твёрдых и мягких кораллов.
