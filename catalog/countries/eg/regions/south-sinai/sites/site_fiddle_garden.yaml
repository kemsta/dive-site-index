content:
  en:
    summary: A distinct Gardens subdivision between Middle and Far Garden, with a sandy plateau and two prominent coral pinnacles.
    access: Usually a boat mooring dive; a gentle drift toward Far Garden is possible.
    hazards: Fragile fire coral, amphora fragments that must not be touched, depth at the drop-off and occasional current.
    marine_life: Sweepers, juvenile fusiliers, hatchetfish and varied soft and hard coral on the pinnacles.
  ru:
    summary: Отдельный участок Gardens между Middle и Far Garden с песчаным плато и двумя заметными коралловыми башнями.
    access: Обычно погружение со швартовки; возможен лёгкий дрифт к Far Garden.
    hazards: Хрупкий огненный коралл, фрагменты амфор, которых нельзя касаться, глубина у свала и периодическое течение.
    marine_life: Стеклянные рыбки, молодые фузилёры, рыбы-топорики и разнообразные мягкие и твёрдые кораллы на башнях.
